name: update-daily-passwords
on:
  schedule:
    - cron: '0 * * * *'    # 每小时(UTC)=北京每小时, 尽快拿到当天数据
    - cron: '15 1 * * *'   # 保留北京9:15(数据源更新后再抓一次)
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch daily passwords
        run: python3 fetch_passwords.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'update daily passwords'
          file_pattern: 'passwords.json'
